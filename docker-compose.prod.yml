# Production stack: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# See DEPLOY.md. Only the web app is published; the API, Postgres and Redis stay on the
# internal network (the web app proxies uploads, downloads and chat to the API).

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rqlens}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rqlens}
  REDIS_URL: redis://redis:6379/0
  DATA_DIR: /data
  ENVIRONMENT: production
  API_JWT_SECRET: ${API_JWT_SECRET:?set API_JWT_SECRET}
  CORS_ORIGINS: '["${PUBLIC_URL:?set PUBLIC_URL}"]'
# The AI provider, limits and SENTRY_DSN are read from .env.prod (see .env.prod.example).
x-api-env-file: &api-env-file [{ path: .env.prod, required: false }]

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  args: { EXTRAS: sentry }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rqlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rqlens}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rqlens}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # Runs the database migrations once, before the API and worker start.
  migrate:
    build: *api-build
    image: rq-lens-api
    environment: *api-env
    env_file: *api-env-file
    command: alembic upgrade head
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: rq-lens-api
    restart: unless-stopped
    environment: *api-env
    env_file: *api-env-file
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes: [appdata:/data]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    image: rq-lens-api
    restart: unless-stopped
    environment: *api-env
    env_file: *api-env-file
    command: arq api.worker.WorkerSettings
    volumes: [appdata:/data]
    healthcheck:
      test: ["CMD", "arq", "--check", "api.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      start_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: apps/web }
    restart: unless-stopped
    environment:
      API_URL_INTERNAL: http://api:8000
      API_JWT_SECRET: ${API_JWT_SECRET:?set API_JWT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      AUTH_TRUST_HOST: "true"
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  appdata:
