[project]
name = "rq-lens"
version = "0.1.0"
description = "Research Dataset Companion: profile a dataset and judge whether it can answer your research questions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.28",
    "openai>=3.0",
    "pyjwt>=2.10",
    "duckdb>=1.1",
    "python-multipart>=0.0.18",
    "numpy>=2.0",
    "scipy>=1.14",
    "sqlglot>=26.0",
    "markdown>=3.7",
    "weasyprint>=63",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "pyreadstat>=1.2.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "rapidocr-onnxruntime>=1.3",
    "wordninja>=2.0",
]

# OCR for scanned papers (apps/api/papers/ocr.py). RapidOCR's models ship in the package.
ocr = ["rapidocr-onnxruntime>=1.3", "wordninja>=2.0"]
# Error tracking, enabled by SENTRY_DSN (see apps/api/observability.py).
sentry = ["sentry-sdk>=2.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps"]
include = ["api*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "tests", "."]
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "apps"
packages = ["api"]

[[tool.mypy.overrides]]
module = ["arq.*", "scipy.*", "weasyprint.*", "markdown.*", "sentry_sdk.*", "pymupdf.*", "openpyxl.*", "pyreadstat.*", "rapidocr_onnxruntime.*", "wordninja.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
